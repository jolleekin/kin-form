name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno lint
      - run: deno fmt --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno test -A --coverage=coverage core react react-devtools validators
      - run: deno coverage coverage --lcov --output=coverage.lcov
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          fail_ci_if_error: false
