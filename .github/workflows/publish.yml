name: Publish

on:
  push:
    tags:
      - "core@*"
      - "react@*"
      - "devtools-react@*"
      - "lit@*"
      - "validators@*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno test -A core react devtools-react lit validators

  publish-core:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/core@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno publish
        working-directory: core
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: deno task --cwd scripts build-npm core
      - run: npm publish --provenance --access public
        working-directory: core/npm

  publish-react:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/react@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno publish
        working-directory: react
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: deno task --cwd scripts build-npm react
      - run: npm publish --provenance --access public
        working-directory: react/npm

  publish-devtools-react:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/devtools-react@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno publish
        working-directory: devtools-react
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: deno task --cwd scripts build-npm devtools-react
      - run: npm publish --provenance --access public
        working-directory: devtools-react/npm

  publish-lit:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/lit@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno publish
        working-directory: lit
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: deno task --cwd scripts build-npm lit
      - run: npm publish --provenance --access public
        working-directory: lit/npm

  publish-validators:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/validators@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno publish
        working-directory: validators
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: deno task --cwd scripts build-npm validators
      - run: npm publish --provenance --access public
        working-directory: validators/npm
