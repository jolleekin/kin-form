name: Publish

on:
  push:
    tags:
      - "core@*"
      - "react@*"
      - "devtools-react@*"
      - "lit@*"
      - "validators@*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno test -A core react devtools-react lit validators

  publish-core-jsr:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/core@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno publish
        working-directory: core

  publish-core-npm:
    needs: [lint, test, publish-core-jsr]
    if: startsWith(github.ref, 'refs/tags/core@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: deno task --cwd scripts build-npm core
      - run: npm publish --provenance --access public
        working-directory: core/npm

  publish-react-jsr:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/react@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno publish
        working-directory: react

  publish-react-npm:
    needs: [lint, test, publish-react-jsr]
    if: startsWith(github.ref, 'refs/tags/react@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: deno task --cwd scripts build-npm react
      - run: npm publish --provenance --access public
        working-directory: react/npm

  publish-devtools-react-jsr:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/devtools-react@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno publish
        working-directory: devtools-react

  publish-devtools-react-npm:
    needs: [lint, test, publish-devtools-react-jsr]
    if: startsWith(github.ref, 'refs/tags/devtools-react@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: deno task --cwd scripts build-npm devtools-react
      - run: npm publish --provenance --access public
        working-directory: devtools-react/npm

  publish-lit-jsr:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/lit@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno publish
        working-directory: lit

  publish-lit-npm:
    needs: [lint, test, publish-lit-jsr]
    if: startsWith(github.ref, 'refs/tags/lit@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: deno task --cwd scripts build-npm lit
      - run: npm publish --provenance --access public
        working-directory: lit/npm

  publish-validators-jsr:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/validators@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno publish
        working-directory: validators

  publish-validators-npm:
    needs: [lint, test, publish-validators-jsr]
    if: startsWith(github.ref, 'refs/tags/validators@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: deno task --cwd scripts build-npm validators
      - run: npm publish --provenance --access public
        working-directory: validators/npm
